# One job per make target of the same name, in parallel, and the image built,
# started and checked. Every job installs with `uv sync --locked`, and
# UV_LOCKED keeps every `uv run` on uv.lock. No secret: the tests fake Mistral
# and Open Agenda and start their own Elasticsearch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only for every job.
permissions:
  contents: read

# A new push cancels the run in progress on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The uv cache, one per job, keyed on uv.lock, not pruned.
      - &setup-uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          prune-cache: false
      - &install
        name: Install the locked environment
        run: uv sync --locked
      - name: Lint the Python
        run: make lint

  # With the rerank, eval and ui extras, so that mypy checks the calls to
  # sentence-transformers, Ragas and Streamlit. The tests need the eval and ui
  # extras only.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - name: Install the locked environment, the rerank, eval and ui extras
        run: uv sync --locked --extra rerank --extra eval --extra ui
      - name: Check the types
        run: make typecheck

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install
      # The hook environments, cached until their versions change.
      - name: Cache the hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Every hook on every file
        run: make pre-commit

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - &install-eval
        name: Install the locked environment, the eval and ui extras
        run: uv sync --locked --extra eval --extra ui
      - name: The unit tests
        run: make test-unit

  # Every test and the coverage of the package; the integration tests start
  # their Elasticsearch with the Docker of the runner. The coverage of each
  # file goes to the summary of the run.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install-eval
      - name: Every test and the coverage
        run: make coverage ARGS="--cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY"

  # The documentation site, every warning an error, kept for docs-publish.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - name: Install the locked environment and the docs group
        run: uv sync --locked --group docs
      - name: The site, strict
        run: make docs-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # The image of the application built (not pushed), the API and the web
  # interface started on it with Elasticsearch, then checked by `make
  # test-smoke`. Dummy secrets, no reranker. The layers of the image are
  # cached.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Set over the values of .env.example: the image, dummy secrets, no
    # reranker.
    env:
      APP_IMAGE: cultural-events-rag
      APP_TAG: ci
      MISTRAL_API_KEY: not-a-key
      OPENAGENDA_API_KEY: not-a-key
      ADMIN_API_KEY: not-a-key
      ELASTIC_PASSWORD: smoke-test-password
      KIBANA_PASSWORD: smoke-test-password
      RERANK_AVAILABLE: "false"
    steps:
      - uses: actions/checkout@v7
      # The tools of the runner the job does not use deleted: the image, its
      # layers and the volumes of the services fill its disk, and Elasticsearch
      # refuses to write above 95% of it.
      - &free-disk
        name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v4
      # Its layers cached by GitHub.
      - name: Build the image of the application
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}:${{ env.APP_TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: The other values, those of the example
        run: cp .env.example .env
      # docker compose on compose.yaml alone, on the image built above. The
      # profile search starts Elasticsearch; Kibana is not started.
      - name: Start the API and the web interface, and what they need
        run: docker compose --profile search up -d --wait api ui
      - *setup-uv
      - *install
      - name: Check that they answer
        run: make test-smoke
      - name: The logs of the services, on failure
        if: failure()
        run: docker compose --profile search logs --no-color --tail 100

  # The site of docs-build on GitHub Pages, from main once every check passes.
  docs-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, pre-commit, test-unit, coverage, docs-build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
