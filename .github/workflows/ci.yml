# One job per make target of the same name, in parallel. Every job installs
# with `uv sync --locked`, which fails when uv.lock no longer matches
# pyproject.toml, and UV_LOCKED keeps every `uv run` on uv.lock. No secret is
# needed: the tests fake Mistral and Open Agenda, and start their own
# Elasticsearch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, and every job inherits it.
permissions:
  contents: read

# A new push stops the run still going on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The packages uv downloads, kept between runs, one cache per job (the
      # typecheck installs the rerank extra), keyed on uv.lock. Not pruned:
      # PyTorch, the largest, would be downloaded again at each run.
      - &setup-uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          prune-cache: false
      - &install
        name: Install the locked environment
        run: uv sync --locked
      - name: Lint the Python
        run: make lint

  # With the rerank extra (PyTorch for the CPU): mypy checks the calls of the
  # reranker against sentence-transformers. The tests replace it: they need
  # no extra.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - name: Install the locked environment and the rerank extra
        run: uv sync --locked --extra rerank
      - name: Check the types
        run: make typecheck

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install
      # The environments of the hooks, built again only when their versions
      # change.
      - name: Cache the hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Every hook on every file
        run: make pre-commit

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install
      - name: The unit tests
        run: make test-unit

  # Every test, unit and integration, and the coverage of the package: the
  # integration tests start their Elasticsearch container with the runner's
  # docker. The coverage of each file is also written in the summary of the
  # run.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install
      - name: Every test and the coverage
        run: make coverage ARGS="--cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
