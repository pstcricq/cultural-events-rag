# One job per make target of the same name, in parallel, and the image built,
# started and checked. Every job installs with `uv sync --locked`, which fails
# when uv.lock no longer matches pyproject.toml, and UV_LOCKED keeps every
# `uv run` on uv.lock. No secret is needed: the tests fake Mistral and Open
# Agenda, and start their own Elasticsearch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, and every job inherits it.
permissions:
  contents: read

# A new push stops the run still going on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The packages uv downloads, kept between runs, one cache per job (each
      # installs its own extras), keyed on uv.lock. Not pruned: PyTorch, the
      # largest, would be downloaded again at each run.
      - &setup-uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          prune-cache: false
      - &install
        name: Install the locked environment
        run: uv sync --locked
      - name: Lint the Python
        run: make lint

  # With the rerank extra (PyTorch for the CPU), the eval extra (Ragas) and
  # the ui extra (Streamlit): mypy checks the calls of the reranker against
  # sentence-transformers, those of the judge against Ragas and those of the
  # page against Streamlit. The tests need the eval and ui extras only.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - name: Install the locked environment, the rerank, eval and ui extras
        run: uv sync --locked --extra rerank --extra eval --extra ui
      - name: Check the types
        run: make typecheck

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install
      # The environments of the hooks, built again only when their versions
      # change.
      - name: Cache the hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Every hook on every file
        run: make pre-commit

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - &install-eval
        name: Install the locked environment, the eval and ui extras
        run: uv sync --locked --extra eval --extra ui
      - name: The unit tests
        run: make test-unit

  # Every test, unit and integration, and the coverage of the package: the
  # integration tests start their Elasticsearch container with the runner's
  # docker. The coverage of each file is also written in the summary of the
  # run.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - *setup-uv
      - *install-eval
      - name: Every test and the coverage
        run: make coverage ARGS="--cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY"

  # The image of the application built, never pushed, then the API and the
  # web interface started on it, with Elasticsearch, and checked by `make
  # test-smoke`: a Dockerfile that no longer builds, or services that no
  # longer start or reach each other, fail here. Dummy secrets: the checks
  # never call Mistral, and no reranker, its model being 2 GB to download. The
  # layers of the image are cached between runs.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # What the job sets itself, over the values of .env.example copied below
    # (the environment wins over .env): the image, named once (the action
    # builds it, compose runs it), dummy secrets, and no reranker.
    env:
      APP_IMAGE: cultural-events-rag
      APP_TAG: ci
      MISTRAL_API_KEY: not-a-key
      OPENAGENDA_API_KEY: not-a-key
      ADMIN_API_KEY: not-a-key
      ELASTIC_PASSWORD: smoke-test-password
      KIBANA_PASSWORD: smoke-test-password
      RERANK_AVAILABLE: "false"
    steps:
      - uses: actions/checkout@v7
      # The tools of the runner the job does not use deleted: the image, its
      # layers and the volumes of the services fill its disk, and Elasticsearch
      # refuses to write above 95% of it.
      - &free-disk
        name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v4
      # As compose.dev.yaml does on a laptop, its layers cached by GitHub.
      - name: Build the image of the application
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}:${{ env.APP_TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: The other values, those of the example
        run: cp .env.example .env
      # docker compose itself, on compose.yaml alone as a server runs it, the
      # image built above: make docker-up would build it again, without the
      # cache of GitHub. With the profile search, Elasticsearch starts too, the
      # API waiting for it; Kibana, needed by neither, does not.
      - name: Start the API and the web interface, and what they need
        run: docker compose --profile search up -d --wait api ui
      - *setup-uv
      - *install
      - name: Check that they answer
        run: make test-smoke
      - name: The logs of the services, on failure
        if: failure()
        run: docker compose --profile search logs --no-color --tail 100
