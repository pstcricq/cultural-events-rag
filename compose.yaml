# The services of the application, the same file in every environment. Every
# value comes from the environment, then from .env, and is required. The ports
# are published on 127.0.0.1. The application runs from one image,
# APP_IMAGE:APP_TAG. Elasticsearch and Kibana run only with the profile search;
# without it, the API reaches the Elasticsearch at API_ELASTICSEARCH_URL.
#
# On this machine: make docker-up (with compose.dev.yaml and the profile
# search). On a server: docker compose --profile search up -d, or without the
# profile for an external Elasticsearch.

name: cultural-events-rag

services:
  # The search engine: one node, the elastic user with ELASTIC_PASSWORD, plain
  # HTTP inside the compose network. ELASTIC_PASSWORD is read at the first
  # start only (make docker-reset deletes the data to change it).
  # ELASTIC_VERSION is the version of every Elastic image and the major version
  # of the Python client.
  elasticsearch:
    profiles: [search]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:?set ELASTIC_VERSION in .env or in the environment}
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env or in the environment}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      # Machine learning off.
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # Published for the commands and the tests run on this machine.
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      # The password is read from the variable of the container.
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]  # gitleaks:allow
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 10

  # Kibana, on http://127.0.0.1:5601, signed in as elastic with
  # ELASTIC_PASSWORD. Kibana itself signs in as kibana_system, whose password
  # kibana-setup sets to KIBANA_PASSWORD at each start.
  kibana-setup:
    profiles: [search]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:?set ELASTIC_VERSION in .env or in the environment}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env or in the environment}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env or in the environment}
    depends_on:
      elasticsearch:
        condition: service_healthy
    # The passwords are read from the variables of the container.
    command: ["bash", "-c", "until curl -fsS -o /dev/null -u \"elastic:$$ELASTIC_PASSWORD\" -H 'Content-Type: application/json' -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -d \"{\\\"password\\\":\\\"$$KIBANA_PASSWORD\\\"}\"; do sleep 2; done; echo 'kibana_system password set'"]  # gitleaks:allow

  kibana:
    profiles: [search]
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:?set ELASTIC_VERSION in .env or in the environment}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env or in the environment}
      TELEMETRY_OPTIN: "false"
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      # The login page answers once Kibana is ready.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5601/login"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 12

  # The Hugging Face models of the API (the Mistral tokenizer and the reranker,
  # about 2 GB), downloaded once into their volume.
  models:
    image: ${APP_IMAGE:?set APP_IMAGE in .env or in the environment}:${APP_TAG:?set APP_TAG in .env or in the environment}
    environment:
      HF_HUB_OFFLINE: "0"
      # false: no reranker to download.
      RERANK_AVAILABLE: ${RERANK_AVAILABLE:?set RERANK_AVAILABLE in .env or in the environment, true or false}
    command: ["cultural-events-rag", "models"]
    volumes:
      - huggingface:/models

  # The REST API, its documentation at /docs. /health answers 503, with the
  # reason, until an index is built or while Elasticsearch cannot be reached.
  api:
    image: ${APP_IMAGE:?set APP_IMAGE in .env or in the environment}:${APP_TAG:?set APP_TAG in .env or in the environment}
    environment:
      # http://elasticsearch:9200 with the profile search, another address
      # without.
      ELASTICSEARCH_URL: ${API_ELASTICSEARCH_URL:?set API_ELASTICSEARCH_URL in .env or in the environment}
      # What it cannot run without.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set MISTRAL_API_KEY in .env or in the environment}
      ELASTIC_USER: ${ELASTIC_USER:?set ELASTIC_USER in .env or in the environment}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env or in the environment}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:?set ELASTICSEARCH_INDEX in .env or in the environment}
      RERANK_AVAILABLE: ${RERANK_AVAILABLE:?set RERANK_AVAILABLE in .env or in the environment, true or false}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:?set LLM_REQUESTS_PER_MINUTE in .env or in the environment}
      # What POST /rebuild collects.
      OPENAGENDA_API_KEY: ${OPENAGENDA_API_KEY:?set OPENAGENDA_API_KEY in .env or in the environment}
      MAX_EVENTS: ${MAX_EVENTS:?set MAX_EVENTS in .env or in the environment, a number or all}
      # The key of POST /rebuild.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env or in the environment}
    volumes:
      - huggingface:/models
      - api-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      # Waited for with the profile search, ignored without.
      elasticsearch:
        condition: service_healthy
        required: false
      models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://localhost:8000/health", timeout=5)
          except urllib.error.HTTPError:
              pass  # 503: the server answers, without an index yet
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 6

  # The web interface, a client of the API reached by its service name; the
  # same image, no secret.
  ui:
    image: ${APP_IMAGE:?set APP_IMAGE in .env or in the environment}:${APP_TAG:?set APP_TAG in .env or in the environment}
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "src/cultural_events_rag/ui/app.py", "--server.address", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8501/_stcore/health", timeout=5)
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

volumes:
  elasticsearch-data:
  huggingface:
  api-data:
