# The cultural_events_rag package and the environment of the repository: `uv sync`
# installs both in .venv, the versions of uv.lock with `uv sync --locked`,
# which fails when uv.lock no longer matches this file.

# uv's own backend builds cultural_events_rag from src/cultural_events_rag/.
[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cultural-events-rag"
version = "0.1.0"
description = "RAG assistant recommending cultural events from Open Agenda."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pierre St-Cricq" },
]

# The oldest Python accepted; .python-version names the one uv installs.
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "tenacity>=9.1",
]

# The links of the project and of its author.
[project.urls]
Repository = "https://github.com/pstcricq/cultural-events-rag"
GitHub = "https://github.com/pstcricq/"
LinkedIn = "https://www.linkedin.com/in/pierre-st-cricq/"

# The cultural-events-rag command, installed by `uv sync`.
[project.scripts]
cultural-events-rag = "cultural_events_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
]

# Any other uv refuses to run on this project.
[tool.uv]
required-version = "==0.12.5"

# pytest's cache inside .venv.
[tool.pytest.ini_options]
cache_dir = ".venv/.pytest_cache"

# The coverage of the package by every test (`make coverage`): below 95% of
# its lines, the run fails. Its data inside .venv.
[tool.coverage.run]
source = ["src/cultural_events_rag"]
data_file = ".venv/.coverage"

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

# Every function typed, the settings checked by pydantic's plugin, the cache
# inside .venv.
[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
cache_dir = ".venv/.mypy_cache"

# ruff's default rules, its cache inside .venv.
[tool.ruff]
cache-dir = ".venv/.ruff_cache"
