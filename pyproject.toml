# The cultural_events_rag package and the environment of the repository,
# installed in .venv by `uv sync` at the versions of uv.lock.

# uv's build backend, from src/cultural_events_rag/.
[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cultural-events-rag"
version = "0.1.0"
description = "RAG assistant recommending cultural events from Open Agenda."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Pierre St-Cricq" },
]

# The oldest Python supported; .python-version names the one uv installs.
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.5,<10",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "huggingface-hub>=2.4.0",
    "langchain-core>=1.8",
    "langchain-mistralai>=1.2",
    "langchain-text-splitters>=1.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "tenacity>=9.1",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

# The links of the project and of its author.
[project.urls]
Repository = "https://github.com/pstcricq/cultural-events-rag"
GitHub = "https://github.com/pstcricq/"
LinkedIn = "https://www.linkedin.com/in/pierre-st-cricq/"

# The cultural-events-rag command.
[project.scripts]
cultural-events-rag = "cultural_events_rag.cli:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]
eval = [
    "ragas>=0.4.4",
]
ui = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "pre-commit>=4.7.0",
    "numpy>=2.5.5",
    "testcontainers>=4.15.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
]

# The only uv version allowed on the project.
[tool.uv]
required-version = "==0.12.5"

# PyTorch for the CPU on Linux; the PyPI wheel on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The pytest cache, inside .venv.
[tool.pytest.ini_options]
cache_dir = ".venv/.pytest_cache"
# A deprecation warning of langchain-community, imported by Ragas.
filterwarnings = [
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]

# The coverage of the package by every test, failing under 95%; its data inside
# .venv.
[tool.coverage.run]
# The source is a folder: the page of the web interface runs as __main__ under
# AppTest.
source = ["src/cultural_events_rag"]
data_file = ".venv/.coverage"

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

# Strict typing, the pydantic plugin, the cache inside .venv.
[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
cache_dir = ".venv/.mypy_cache"

# ruff's default rules, its cache inside .venv.
[tool.ruff]
cache-dir = ".venv/.ruff_cache"
