# The hooks run on the files of each commit, and the unit tests before each
# push. A hook that fixes a file stops the commit: add the file and commit
# again.
default_install_hook_types: [pre-commit, pre-push]
# A hook runs before each commit unless it names its own stages.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # The frozen events of the benchmark, 3.5 MB, versioned.
      - id: check-added-large-files
        exclude: ^data/benchmark/events\.jsonl$
      - id: detect-private-key

  # API keys in a committed file.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ruff through uv, at the version of uv.lock, on the files of the commit; the
  # unit tests through their make target.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: test-unit
        name: unit tests
        entry: make test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
